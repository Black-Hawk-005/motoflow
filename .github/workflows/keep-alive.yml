name: keep alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl --fail --silent --show-error --retry 3 --retry-delay 30 --max-time 90 https://motoflow.onrender.com/health