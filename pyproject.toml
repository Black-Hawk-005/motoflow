[project]
name = "motoflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "sqlalchemy>=2.0.50",
    "alembic>=1.18.4",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.13.0",
    "pwdlib[argon2]>=0.3.0",
    "psycopg[binary]>=3.3.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
